spring.application.name=bankxyz-migracion-batch
server.port=8081

# --- H2 en memoria ------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bankxyz_batch;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para revisar los datos procesados en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ejecuta schema.sql al levantar la app (recrea las tablas de negocio cada vez)
spring.sql.init.mode=always

# Crea las tablas propias de Spring Batch (BATCH_JOB_INSTANCE, BATCH_STEP_EXECUTION, etc.)
spring.batch.jdbc.initialize-schema=always

# Los Jobs NO se disparan solos al iniciar la app: se disparan manualmente
# vía POST desde Postman, a traves de los controllers REST.
spring.batch.job.enabled=false

# Rutas de los archivos CSV de origen (datos legacy del Banco XYZ)
bankxyz.archivo-transacciones=classpath:data/transacciones.csv
bankxyz.archivo-intereses=classpath:data/intereses.csv
bankxyz.archivo-cuentas-anuales=classpath:data/cuentas_anuales.csv

logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bankxyz=DEBUG
